name: Daily Money Brief
permissions:
  contents: write

on:
  schedule:
    - cron: '30 3 * * 1-5'   # 09:00 IST on weekdays
  workflow_dispatch:         # Allow manual run

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jugaad-data feedparser

      - name: Generate brief
        run: python generate_brief.py

      - name: Commit and push brief.txt
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add brief.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Money Brief $(date +'%Y-%m-%d')"
          git push
